[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myopencode"
version = "0.1.0"
description = "Desktop AI coding agent backend (sidecar for the Tauri shell)"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=41.0,<43",
]

[project.optional-dependencies]
providers = [
    "openai>=1.30",
    "anthropic>=0.34",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
myopencode = "myopencode.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "E7"]