# cargo-deny configuration for myopencode
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
# Vulnerability / unsound / notice advisories always emit errors in current
# cargo-deny; unmaintained only fails when a direct workspace dep is affected.
unmaintained = "workspace"
yanked = "warn"

[bans]
multiple-versions = "warn"
# No wildcard or otherwise-non-pinned versions.
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[licenses]
# Neutral permissive licenses used across the Tauri / compiled-deps tree.
# Not listed here => denied by default.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Libpng",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "WTFPL",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []
private = { ignore = true }

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "https://github.com/spack-rs/crates.io-index",
]